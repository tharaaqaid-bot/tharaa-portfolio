<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Al Mawadda coffee packaging illustration">
  <defs>
    <linearGradient id="mwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e7d3"/>
      <stop offset="1" stop-color="#e1cdb1"/>
    </linearGradient>
    <pattern id="mwPattern" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M32 4l12 28-12 28-12-28z" fill="#b85c3c" fill-opacity="0.14"/>
      <circle cx="32" cy="32" r="3" fill="#78805f" fill-opacity="0.28"/>
    </pattern>
    <clipPath id="mwBag">
      <path d="M292 196h216l18 270c1 14-10 26-24 26H298c-14 0-25-12-24-26z"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="url(#mwBg)"/>
  <rect width="800" height="600" fill="url(#mwPattern)"/>

  <!-- soft backdrop -->
  <circle cx="606" cy="204" r="150" fill="#e8c7b6" opacity="0.75"/>
  <path d="M0 600V460c80-60 174-60 254 0v140z" fill="#b85c3c" opacity="0.1"/>

  <!-- package -->
  <path d="M292 196h216l18 270c1 14-10 26-24 26H298c-14 0-25-12-24-26z" fill="#3b2a22"/>
  <g clip-path="url(#mwBag)">
    <rect x="270" y="196" width="260" height="300" fill="url(#mwPattern)" opacity="0.5" style="filter:hue-rotate(0deg)"/>
    <path d="M270 196h260v36H270z" fill="#2d211b"/>
    <path d="M270 462h260v34H270z" fill="#2d211b"/>
  </g>
  <path d="M292 196h216l18 270c1 14-10 26-24 26H298c-14 0-25-12-24-26z" fill="none" stroke="#1f1510" stroke-width="1.5"/>
  <path d="M312 196c0-18 154-18 154 0" fill="none" stroke="#1f1510" stroke-width="3"/>

  <!-- label -->
  <rect x="316" y="258" width="168" height="168" rx="4" fill="#f7f3ea"/>
  <rect x="324" y="266" width="152" height="152" rx="2" fill="none" stroke="#b85c3c" stroke-width="1"/>
  <path d="M400 282l10 22-10 22-10-22z" fill="#b85c3c"/>
  <text x="400" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#2d211b">Al Mawadda</text>
  <path d="M356 366h88" stroke="#c8a264" stroke-width="1.5"/>
  <text x="400" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" letter-spacing="3" fill="#7c6c5e">ARTISAN COFFEE</text>
  <text x="400" y="406" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#b85c3c">slow roasted · 250g</text>

  <!-- side accents -->
  <g fill="none" stroke="#b85c3c" stroke-width="1.5" opacity="0.8">
    <path d="M102 250h120"/>
    <path d="M102 270h70"/>
    <circle cx="102" cy="290" r="5"/>
    <path d="M600 470h110"/>
    <path d="M640 490h70"/>
  </g>
  <g fill="#78805f" opacity="0.6">
    <circle cx="140" cy="430" r="6"/>
    <circle cx="166" cy="456" r="4"/>
    <circle cx="118" cy="456" r="3"/>
  </g>

  <text x="48" y="548" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#2d211b">Al Mawadda</text>
  <text x="50" y="572" font-family="Arial, sans-serif" font-size="10" letter-spacing="4" fill="#7c6c5e">BRANDING  ·  2023</text>
</svg>
